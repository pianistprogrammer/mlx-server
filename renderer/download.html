<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Download Model</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 52px 24px 24px; -webkit-app-region: drag; }
body * { -webkit-app-region: no-drag; }

h2 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 6px; }
.subtitle { font-size: 12px; color: #555; margin-bottom: 20px; }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
.field input { width: 100%; background: #252525; border: 1px solid #333; border-radius: 8px; color: #e0e0e0; font-size: 14px; padding: 9px 12px; outline: none; }
.field input:focus { border-color: #007AFF; }
.field input::placeholder { color: #444; }

.path-row { display: flex; gap: 8px; }
.path-row input { flex: 1; }
.browse-btn { background: #252525; border: 1px solid #333; color: #aaa; font-size: 13px; padding: 9px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.browse-btn:hover { background: #2e2e2e; }

.suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.suggestion { background: #222; border: 1px solid #2a2a2a; color: #888; font-size: 11px; padding: 4px 10px; border-radius: 12px; cursor: pointer; }
.suggestion:hover { color: #ccc; background: #2a2a2a; }

#progress-wrap { display: none; margin: 16px 0; }
#progress-bar-bg { background: #222; border-radius: 4px; height: 6px; overflow: hidden; margin-bottom: 8px; }
#progress-bar { height: 100%; background: #007AFF; width: 0%; transition: width 0.3s; border-radius: 4px; }
#progress-text { font-size: 12px; color: #666; }
#log { background: #111; border-radius: 8px; padding: 10px 12px; font-family: monospace; font-size: 11px; color: #666; max-height: 100px; overflow-y: auto; margin-top: 8px; display: none; }

.actions { display: flex; gap: 8px; margin-top: 4px; }
.btn { padding: 9px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
.btn-primary { background: #007AFF; color: white; }
.btn-primary:hover { background: #0066dd; }
.btn-primary:disabled { background: #333; color: #555; cursor: default; }
.btn-secondary { background: #252525; border: 1px solid #333; color: #aaa; }
.btn-secondary:hover { background: #2e2e2e; }
</style>
</head>
<body>
<h2>Download Model from Hugging Face</h2>
<p class="subtitle">Enter a Hugging Face repo ID — mlx-community models are recommended for best performance.</p>

<div class="field">
  <label>Hugging Face Repo ID</label>
  <input type="text" id="repo-id" placeholder="e.g. mlx-community/gemma-3-12b-it-4bit">
  <div class="suggestions">
    <span class="suggestion" onclick="setRepo('mlx-community/gemma-3-12b-it-4bit')">gemma-3-12b-it-4bit</span>
    <span class="suggestion" onclick="setRepo('mlx-community/Llama-3.2-3B-Instruct-4bit')">Llama-3.2-3B-4bit</span>
    <span class="suggestion" onclick="setRepo('mlx-community/Mistral-7B-Instruct-v0.3-4bit')">Mistral-7B-4bit</span>
    <span class="suggestion" onclick="setRepo('mlx-community/Phi-3.5-mini-instruct-4bit')">Phi-3.5-mini-4bit</span>
    <span class="suggestion" onclick="setRepo('mlx-community/gemma-4-12B-it-4bit')">gemma-4-12B-it-4bit</span>
  </div>
</div>

<div class="field">
  <label>Save to folder</label>
  <div class="path-row">
    <input type="text" id="save-path" readonly>
    <button class="browse-btn" onclick="browse()">Browse</button>
  </div>
</div>

<div id="progress-wrap">
  <div id="progress-bar-bg"><div id="progress-bar"></div></div>
  <div id="progress-text">Starting download...</div>
  <div id="log"></div>
</div>

<div class="actions">
  <button class="btn btn-secondary" onclick="window.close()">Cancel</button>
  <button class="btn btn-primary" id="dl-btn" onclick="startDownload()">Download</button>
</div>

<script>
const { ipcRenderer } = require('electron');

function setRepo(id) { document.getElementById('repo-id').value = id; }

async function browse() {
    const dir = await ipcRenderer.invoke('browse-dir');
    if (dir) document.getElementById('save-path').value = dir;
}

ipcRenderer.invoke('get-settings').then(s => {
    document.getElementById('save-path').value = s.modelPath || '/Volumes/AI/LLMS';
});

ipcRenderer.on('download-progress', (_, { percent, file, log }) => {
    if (percent !== undefined) {
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-text').textContent = `${Math.round(percent)}% — ${file || ''}`;
    }
    if (log) {
        const logEl = document.getElementById('log');
        logEl.style.display = 'block';
        logEl.textContent += log + '\n';
        logEl.scrollTop = logEl.scrollHeight;
    }
});

ipcRenderer.on('download-done', (_, { ok, error }) => {
    const btn = document.getElementById('dl-btn');
    if (ok) {
        document.getElementById('progress-text').textContent = '✓ Download complete!';
        document.getElementById('progress-bar').style.background = '#34c759';
        btn.textContent = 'Done';
        btn.onclick = () => window.close();
        btn.disabled = false;
    } else {
        document.getElementById('progress-text').textContent = 'Error: ' + error;
        document.getElementById('progress-bar').style.background = '#ff453a';
        btn.textContent = 'Retry';
        btn.disabled = false;
    }
});

function startDownload() {
    const repo = document.getElementById('repo-id').value.trim();
    const savePath = document.getElementById('save-path').value.trim();
    if (!repo) { document.getElementById('repo-id').focus(); return; }

    document.getElementById('progress-wrap').style.display = 'block';
    document.getElementById('dl-btn').disabled = true;
    document.getElementById('dl-btn').textContent = 'Downloading...';
    document.getElementById('progress-bar').style.background = '#007AFF';

    ipcRenderer.invoke('download-model', { repo, savePath });
}
</script>
</body>
</html>
